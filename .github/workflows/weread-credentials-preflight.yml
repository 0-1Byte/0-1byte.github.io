name: WeRead credential preflight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weread-credentials-preflight-${{ github.repository }}
  cancel-in-progress: false

jobs:
  preflight:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test credential preflight offline
        run: python tools/test_weread_credentials_preflight.py

      - name: Check upload credential
        env:
          WEREAD_UPLOAD_SECRET: ${{ secrets.WEREAD_UPLOAD_SECRET }}
        run: python tools/weread_credentials_preflight.py upload

      - name: Check report credential
        if: always()
        env:
          WEREAD_SYNC_REPORT_SECRET: ${{ secrets.WEREAD_SYNC_REPORT_SECRET }}
        run: python tools/weread_credentials_preflight.py report
