name: Deploy Hugo site to Pages

on:
  push:
    branches: ["main"]  # 只要你往 main 分支推代码，就会触发自动更新

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive  # 这一行很重要，用来拉取你的 PaperMod 主题
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Optimize homepage backgrounds
        run: |
          python -m pip install Pillow
          python tools/optimize_home_backgrounds.py
      - name: Enrich music credits
        run: python tools/enrich_music_credits.py
      - name: Build
        run: hugo --minify --cleanDestinationDir
      - name: Verify homepage quote data and behavior
        run: node tools/verify_quotes.js
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4