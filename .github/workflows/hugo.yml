name: Deploy Hugo site to Pages

on:
  push:
    branches: ["main"]  # 只要你往 main 分支推代码，就会触发自动更新

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive  # 这一行很重要，用来拉取你的 PaperMod 主题
      - name: Refuse private WeRead dataset
        run: |
          set -euo pipefail
          if [[ -e data/weread_quotes.json || -e static/weread_quotes.json ]]; then
            echo "::error::Private WeRead dataset must not be present in the Pages build."
            exit 1
          fi
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore optimized homepage backgrounds
        uses: actions/cache@v4
        with:
          path: |
            static/home/backgrounds-optimized
            .cache/homepage-backgrounds
          key: ${{ runner.os }}-homepage-backgrounds-v5-py311-pillow10.4-${{ hashFiles('static/home/backgrounds/**', 'tools/optimize_home_backgrounds.py') }}
          restore-keys: |
            ${{ runner.os }}-homepage-backgrounds-v5-py311-pillow10.4-
      - name: Optimize homepage backgrounds
        run: |
          python -m pip install Pillow==10.4.0
          python tools/optimize_home_backgrounds.py
      - name: Verify incremental homepage background generation
        run: python tools/test_optimize_home_backgrounds.py
      - name: Enrich music credits
        run: python tools/enrich_music_credits.py
      - name: Build
        run: hugo --minify --cleanDestinationDir
      - name: Verify no private WeRead dataset was published
        run: |
          set -euo pipefail
          if [[ -e public/data/weread_quotes.json || -e public/weread_quotes.json ]]; then
            echo "::error::Private WeRead dataset was found in the Pages output."
            exit 1
          fi
          if find public -type f -iname '*weread*quotes*.json' -print -quit | grep -q .; then
            echo "::error::A WeRead quote JSON file was found in the Pages output."
            exit 1
          fi
      - name: Verify homepage quote data and behavior
        run: node tools/verify_quotes.js
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4