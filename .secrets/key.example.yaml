# ===========================================================================
# 微信读书 API Key —— 这个文件被 .gitignore 忽略，不会进仓库、不会上线
#
# 怎么用：
#   1. 把这个文件复制成同目录下的 key.yaml（去掉 .example 后缀）
#         copy .secrets\key.example.yaml .secrets\key.yaml
#   2. 打开 https://weread.qq.com/r/weread-skills 用微信读书账号登录
#   3. 点「创建 Key」，复制那串 wrk- 开头的字符串
#   4. 填到下面 api_key 的引号里
#
# 为什么单独放一个文件而不是环境变量：
#   环境变量容易在截图、日志、`env` 输出里被顺手带出去；
#   放在被忽略的文件里更可控，也能用 git check-ignore 明确验证。
#
# 验证它确实不会被提交：
#   git check-ignore -v .secrets/key.yaml
#   —— 应当输出 .gitignore 里对应的规则行
#
# 注意：Key 只在本机使用。导出脚本在你自己电脑上运行，
#       产出的是纯文本句子，Key 不会进入任何被提交的文件。
# ===========================================================================

api_key: "在这里填 wrk- 开头的 Key"

# 可选：网关地址。正常情况不用改。
# endpoint: "https://i.weread.qq.com/api/agent/gateway"
