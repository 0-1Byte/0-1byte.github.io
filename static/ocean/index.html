<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" type="image/svg+xml" href="/ocean/ocean-favicon.svg?v=1">
  <link rel="apple-touch-icon" href="/ocean/ocean-favicon.svg?v=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">

  <meta name="robots" content="noindex">
  <title>Ocean — Chen</title>

  <!-- 主题：这一页不跟随 light/dark 的底色，但要在本地存一个值给别的页面用 -->
  <script>
    (() => {
      const saved = localStorage.getItem("pref-theme") || localStorage.getItem("music-theme");
      if (saved && !localStorage.getItem("pref-theme")) {
        localStorage.setItem("pref-theme", saved);
      }
      const dark = saved === "dark" ||
        (!saved && window.matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.dataset.theme = dark ? "dark" : "light";
    })();
  </script>

  <link rel="stylesheet" href="/ocean/style.css?v=2">
</head>

<body class="ocean-body">

  <!-- 海面：WebGL 可用时由 shader 画；不可用时画布隐藏，露出下层静态 CSS 海面 -->
  <canvas id="ocean" aria-hidden="true"></canvas>
  <div class="ocean-fallback" aria-hidden="true"></div>
  <div class="ocean-haze" aria-hidden="true"></div>

  <main class="ocean-stage">

    <!-- 唯一的固定文字：名字。点它回主页 -->
    <a class="ocean-name" href="/" aria-label="Chen —— 回到首页">Chen</a>

    <!-- 海面上偶尔出现的东西。由 /ocean/script.js 依据 /nav.json 生成，
         每一个都指向一个真实分区；没有可辨认的东西时不留空白，给出说明。 -->
    <div class="ocean-objects" id="ocean-objects"></div>

    <!-- 失败 / 空状态说明。默认隐藏，出问题时才出现 -->
    <p class="ocean-note" id="ocean-note" hidden></p>

  </main>

  <script src="/ocean/script.js?v=2" defer></script>
</body>
</html>
