<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="/music/vinyl-favicon.svg?v=1">
  <link rel="apple-touch-icon" href="/music/vinyl-favicon.svg?v=1">

  <!-- 防止主题切换时出现白屏闪烁 -->
  <script>
    (() => {
      const saved = localStorage.getItem("pref-theme") || localStorage.getItem("music-theme");
      const dark = saved === "dark" ||
        (!saved && window.matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.dataset.theme = dark ? "dark" : "light";
    })();
  </script>

  <link rel="stylesheet" href="/music/style.css">
  <title>Music — Chen</title>
</head>

<body>
  <div class="page">
    <header class="header">
      <a class="home" href="/">← home</a>
      <button id="theme-toggle" class="theme-toggle" accesskey="t" type="button"
              aria-label="切换主题" title="切换主题">
        <svg class="moon" xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round"
             stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
        <svg class="sun" xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round"
             stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1" x2="12" y2="3"/>
          <line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          <line x1="1" y1="12" x2="3" y2="12"/>
          <line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
          <line x1="18.36" y1="19.78" x2="19.78" y2="18.36"/>
        </svg>
      </button>
    </header>

    <main>
      <section class="hero">
        <div>
          <p class="label">MUSIC</p>
          <h1>Things I like to hear.</h1>
        </div>
        <p class="count" id="song-count"></p>
      </section>

      <div id="song-grid" class="song-grid"></div>

      <div id="error" class="error" hidden>
        无法读取歌曲数据，请检查 <code>/music/songs.json</code>。
      </div>
    </main>

    <footer class="footer">
      <span>Chen</span>
      <span id="year"></span>
    </footer>
  </div>

  <script src="/music/script.js" defer></script>
</body>
</html>
