<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
  <script>
    (() => {
      document.documentElement.dataset.theme = "dark";
      try { localStorage.setItem("pref-theme", "dark"); } catch (e) { /* 隐私模式忽略 */ }
    })();
  </script>
  <link rel="stylesheet" href="/theme.css?v=1">
  <link rel="stylesheet" href="/site-nav.css?v=7">
  <link rel="stylesheet" href="/collection-states.css?v=2">
  <link rel="stylesheet" href="/back-to-top.css?v=1">
  <link rel="preload" href="/game/games.json?v=1" as="fetch" type="application/json" crossorigin="anonymous">
  <link rel="stylesheet" href="/game/style.css?v=1">
  <title>Game — Chen</title>
</head>
<body>
  <div class="page">
    <header class="header">
      <div class="logo">
        <a href="/" accesskey="h">Chen</a>
      </div>
      <div class="header-nav">
        <div class="site-nav" data-site-nav></div>
      </div>
    </header>
    <main>
      <section class="hero">
        <h1>Games I like to play.</h1>
        <p class="count" id="game-count"></p>
      </section>
      <div id="game-grid" class="game-grid"></div>
      <div id="empty" class="empty" hidden>还没有添加游戏。</div>
      <div id="error" class="collection-state" hidden></div>
    </main>
    <footer class="footer"><span>Chen</span><span id="year"></span></footer>
  </div>
  <script src="/site-nav.js?v=7" defer></script>
  <script src="/collection-common.js?v=1" defer></script>
  <script src="/covers.js?v=1" defer></script>
  <script src="/game/script.js?v=1" defer></script>
  <script src="/back-to-top.js?v=1" defer></script>
</body>
</html>
