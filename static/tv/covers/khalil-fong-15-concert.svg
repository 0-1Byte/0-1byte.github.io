<svg xmlns="http://www.w3.org/2000/svg" width="480" height="720" viewBox="0 0 480 720" role="img" aria-labelledby="title description">
  <title id="title">方大同《15》演唱会</title>
  <desc id="description">为网站 TV 页面制作的原创演唱会主题封面，不是官方宣传图。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset=".55" stop-color="#151624"/>
      <stop offset="1" stop-color="#271a27"/>
    </linearGradient>
    <radialGradient id="stage-light">
      <stop offset="0" stop-color="#f6c982" stop-opacity=".85"/>
      <stop offset="1" stop-color="#f6c982" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f6c982" stop-opacity=".25"/>
      <stop offset="1" stop-color="#f6c982" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>
  <rect width="480" height="720" fill="url(#background)"/>
  <ellipse cx="240" cy="265" rx="150" ry="180" fill="url(#stage-light)" filter="url(#soft-glow)"/>
  <path d="M66 0h66l102 430H194zM348 0h66L286 430h-40z" fill="url(#beam)"/>
  <path d="M56 0h2v210h-2zM422 0h2v210h-2z" fill="#f3d9aa" opacity=".55"/>
  <circle cx="57" cy="218" r="13" fill="#f3d9aa" opacity=".8"/>
  <circle cx="423" cy="218" r="13" fill="#f3d9aa" opacity=".8"/>
  <path d="M42 490h396" stroke="#f3d9aa" stroke-opacity=".35"/>
  <text x="42" y="76" fill="#f3d9aa" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="5">CONCERT ARCHIVE</text>
  <text x="240" y="365" fill="#fff7ec" font-family="Arial,sans-serif" font-size="226" font-weight="300" letter-spacing="-14" text-anchor="middle">15</text>
  <text x="240" y="548" fill="#fff7ec" font-family="sans-serif" font-size="36" font-weight="600" letter-spacing="3" text-anchor="middle">方大同</text>
  <text x="240" y="584" fill="#d9c8b7" font-family="Arial,sans-serif" font-size="14" letter-spacing="4" text-anchor="middle">KHALIL FONG</text>
  <text x="240" y="656" fill="#f3d9aa" font-family="Arial,sans-serif" font-size="13" letter-spacing="3" text-anchor="middle">2011 · LIVE CONCERT</text>
  <text x="240" y="690" fill="#a9a2a3" font-family="Arial,sans-serif" font-size="9" letter-spacing="1.5" text-anchor="middle">ORIGINAL SITE ARTWORK · NOT OFFICIAL</text>
