# 保持这个简单的 baseURL，或者直接写 '/'
baseURL = 'https://0-1byte.github.io/'
# 修正 1：Hugo v0.158+ 废弃了 languageCode，建议换成 locale 消除警告
locale = 'zh-cn'
title = 'Chen'
theme = 'PaperMod'

# 核心修正：删掉之前的 relativeURLs = true（它往往是乱码的元凶）
# 加上下面这两行，确保资源路径能被正确解析
canonifyURLs = true
relativeURLs = false

# 修正 2：添加 author 配置，解决 rss.xml 渲染报错
[author]
    name = "Chen"

# 阶段 3：把导航数据（data/nav.yaml）输出成 /nav.json，
# 供 static/ 下的合集页在运行时读取 —— 那些页面不经过 Hugo 模板，
# 无法使用 extend_head.html 的注入。Hugo 页面仍走服务端渲染。
#
# 说明：输出格式取名 NavIndex，避免与 Hugo 内置的 JSON 输出格式冲突
# （内置的那个会固定写成 index.json，baseName 不生效）。
# 注意：/index.json 现为导航数据。当前站点未启用搜索（无 content/search.md），
# 若日后要启用 PaperMod 搜索，需另开一个输出格式，不要复用 index.json。
[mediaTypes."application/json"]
    suffixes = ["json"]

[outputFormats.NavIndex]
    mediaType = "application/json"
    baseName = "nav"
    isPlainText = true
    isHTML = false
    rel = "alternate"

# 阶段 6：把 content/fragments/ 的内容输出成 /fragments/fragments.json，
# 供 static/random/ 抽取碎片用。
# 为什么不用内置 JSON：内置的会固定写成 index.json，baseName 不生效。
# 为什么不复用 NavIndex：两者 mediaType 相同但 baseName 不同，
# 复用会导致文件名相同而互相覆盖。
[outputFormats.FragmentsIndex]
    mediaType = "application/json"
    baseName = "fragments"
    isPlainText = true
    isHTML = false
    rel = "alternate"

[outputs]
    home = ["HTML", "NavIndex"]

[params]
    env = "production"

    author = "Chen"

    ShowFullTextContent = false
    disableSpecialFirstPost = true

    [params.homeInfoParams]
        Title = "focus"

    [params.cover]
        responsiveImages = true
        linkFullImages = false
        displayFullPostContent = false

    [params.assets]
        favicon = "cat.ico"

# 导航已改由 data/nav.yaml 驱动（阶段 3 信息架构重组）。
# 原来的 [[menu.main]] 扁平菜单（Music/Book/Works/Docu/Film/TV）已废弃：
# 现在顶层是 listen / read / watch / make / think 五个分组，
# watch 带 Film/TV/Docu 下拉。结构只有一处来源，避免与合集页硬编码导航漂移。
#
# 旧 URL 全部保持不变：/music/ /book/ /works/ /docu/ /film/ /tv/
