# 保持这个简单的 baseURL，或者直接写 '/'
baseURL = 'https://0-1byte.github.io/'
# 修正 1：Hugo v0.158+ 废弃了 languageCode，建议换成 locale 消除警告
locale = 'zh-cn'
title = 'Chen'
theme = 'PaperMod'

# 核心修正：删掉之前的 relativeURLs = true（它往往是乱码的元凶）
# 加上下面这两行，确保资源路径能被正确解析
canonifyURLs = true
relativeURLs = false

# 修正 2：添加 author 配置，解决 rss.xml 渲染报错
[author]
    name = "Chen"

# 阶段 3：把导航数据（data/nav.yaml）输出成 /nav.json，
# 供 static/ 下的合集页在运行时读取 —— 那些页面不经过 Hugo 模板，
# 无法使用 extend_head.html 的注入。Hugo 页面仍走服务端渲染。
#
# 说明：输出格式取名 NavIndex，避免与 Hugo 内置的 JSON 输出格式冲突
# （内置的那个会固定写成 index.json，baseName 不生效）。
#
# 实测结论（重要）：首页的多个自定义输出格式会共用同一个模板文件
# layouts/index.json —— Hugo 按 kind 而不是格式名找模板，baseName 只决定文件名。
# 所以 /nav.json 现在是「站点运行时数据」这一个端点，里面同时包含
#   · groups / standalone  导航结构       -> static/site-nav.js、ocean/script.js
#   · quotes               首屏句子库     -> static/quotes.js
# 这样只发一个请求，也避免再造一个只是为了名字好看的端点。
#
# 当前站点未启用搜索（无 content/search.md）；若日后要启用 PaperMod 搜索，
# 需另开一个输出格式，不要复用 nav 这个 baseName。
[mediaTypes."application/json"]
    suffixes = ["json"]

[outputFormats.NavIndex]
    mediaType = "application/json"
    baseName = "nav"
    isPlainText = true
    isHTML = false
    rel = "alternate"

# 阶段 6：把 content/fragments/ 的内容输出成 /fragments/fragments.json，
# 供 static/random/ 抽取碎片用。
# 为什么不用内置 JSON：内置的会固定写成 index.json，baseName 不生效。
# 为什么不复用 NavIndex：两者 mediaType 相同但 baseName 不同，
# 复用会导致文件名相同而互相覆盖。
[outputFormats.FragmentsIndex]
    mediaType = "application/json"
    baseName = "fragments"
    isPlainText = true
    isHTML = false
    rel = "alternate"

# 实测结论：首页的多个自定义输出格式会共用同一个模板文件 layouts/index.json，
# 因为 Hugo 按 kind 找模板、baseName 只决定文件名。
# 所以不再为句子库单开一个格式 —— 它并进 /nav.json，
# 与导航数据同一个端点，只发一个请求。
# 详见 layouts/index.json 顶部说明。


[outputs]
    home = ["HTML", "NavIndex"]

[params]
    env = "production"

    author = "Chen"

    # ---------------------------------------------------------------------------
    # 主题：固定深色，全站不再提供切换（阶段 7）
    #
    # disableThemeToggle = true 会同时抑制 PaperMod 的两段脚本：
    #   · head.html 里按 localStorage / 系统偏好选主题的那段
    #   · footer.html 里给 #theme-toggle 绑点击的那段
    # 后者尤其重要：按钮删掉之后 getElementById 返回 null，
    # 不加这个开关会在每个 Hugo 页面上抛 TypeError（console 报红）。
    #
    # defaultTheme 必须一起设成 "dark"：关掉开关后 head.html 走
    # 「disabled 且非 dark/light」那个分支，会按系统偏好选主题，
    # 于是浅色系统的访客会看到浅色页。
    #
    # 实际把 dataset.theme 设成 dark 的是 layouts/partials/extend_head.html，
    # 这两项只是让主题自己那套初始化闭嘴。
    # /ocean/ 不加载 extend_head.html，有自己的按时间配色，不受影响。
    # ---------------------------------------------------------------------------
    disableThemeToggle = true
    defaultTheme = "dark"

    ShowFullTextContent = false
    disableSpecialFirstPost = true

    [params.homeInfoParams]
        Title = "focus"

    [params.cover]
        responsiveImages = true
        linkFullImages = false
        displayFullPostContent = false

    [params.assets]
        favicon = "cat.ico"
        apple_touch_icon = "apple-touch-icon.png"

# 导航已改由 data/nav.yaml 驱动（阶段 3 信息架构重组）。
# 原来的 [[menu.main]] 扁平菜单（Music/Book/Works/Docu/Film/TV）已废弃：
# 现在顶层是 listen / read / watch / make / think 五个分组，
# watch 带 Film/TV/Docu 下拉。结构只有一处来源，避免与合集页硬编码导航漂移。
#
# 旧 URL 全部保持不变：/music/ /book/ /works/ /docu/ /film/ /tv/
