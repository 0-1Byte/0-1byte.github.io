# 保持这个简单的 baseURL，或者直接写 '/'
baseURL = 'https://0-1byte.github.io/my-blog/'
languageCode = 'zh-cn'
title = '0-1Byte'
theme = 'PaperMod'

# 核心修正：删掉之前的 relativeURLs = true（它往往是乱码的元凶）
# 加上下面这两行，确保资源路径能被正确解析
canonifyURLs = true
relativeURLs = false

[params]
    env = "production"
    # 开启卡片式布局
    ShowFullTextContent = false
    # 这里的设置会让首页排版更有序
    # 隐藏第一篇文章的大图模式（强制它和其他文章一样小）
    disableSpecialFirstPost = true 
    [params.homeInfoParams]
        Title = "0-1Byte,Enjoy"
    [params.cover]
        responsiveImages = true # 自动根据屏幕缩放图片
        linkFullImages = false  # 点击图片不跳转原图
        # 这一行是灵魂：让首页列表显示更小、更精致的图片
        displayFullPostContent = false



