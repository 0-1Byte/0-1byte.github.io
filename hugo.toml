# 保持这个简单的 baseURL，或者直接写 '/'
baseURL = 'https://0-1byte.github.io/'
# 修正 1：Hugo v0.158+ 废弃了 languageCode，建议换成 locale 消除警告
locale = 'zh-cn'
title = 'Chen'
theme = 'PaperMod'

# 核心修正：删掉之前的 relativeURLs = true（它往往是乱码的元凶）
# 加上下面这两行，确保资源路径能被正确解析
canonifyURLs = true
relativeURLs = false

# 修正 2：添加 author 配置，解决 rss.xml 渲染报错
[author]
    name = "Chen"

[params]
    env = "production"

    [params.author]
        name = "Chen"

    ShowFullTextContent = false
    disableSpecialFirstPost = true

    [params.homeInfoParams]
        Title = "focus"

    [params.cover]
        responsiveImages = true
        linkFullImages = false
        displayFullPostContent = false

    [params.assets]
        favicon = "cat.ico"

[menu]

[[menu.main]]
    identifier = "music"
    name = "Music"
    url = "/music/"
    weight = 30

