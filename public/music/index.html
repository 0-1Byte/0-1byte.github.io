<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="/music/vinyl-favicon.svg?v=1">
  <link rel="apple-touch-icon" href="/music/vinyl-favicon.svg?v=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">

  <!-- 主题固定为深色
       主题切换按钮已移除，所以这里不再读取 localStorage 或系统偏好 ——
       否则一个遗留的 "light" 偏好会让访客看到浅色，而他已经无法切回。
       保留写入是为了别的脚本/以后恢复按钮时仍有一致的键名。 -->
  <script>
    (() => {
      document.documentElement.dataset.theme = "dark";
      try { localStorage.setItem("pref-theme", "dark"); } catch (e) { /* 隐私模式忽略 */ }
    })();
  </script>


  <!-- 并行预取歌曲数据：与 script.js 同时开始下载，避免
       HTML → script.js → songs.json 的串行等待。MIME 必须匹配，否则浏览器会重复请求。 -->
  <link rel="preload" href="/music/songs.json?v=2" as="fetch" type="application/json" crossorigin="anonymous">

<link rel="stylesheet" href="/theme.css?v=1">
  <link rel="stylesheet" href="/site-nav.css?v=5">
  <link rel="stylesheet" href="/collection-states.css?v=2">
  <link rel="stylesheet" href="/back-to-top.css?v=1">
  <link rel="stylesheet" href="/music/style.css?v=9">
  <title>Music — Chen</title>
</head>

<body>
  <div class="page">
    <header class="header">
        <div class="logo">
          <a href="/" accesskey="h" title="Chen (Alt + H)">Chen</a>
        </div>
      <div class="header-nav">
        <div class="site-nav" data-site-nav></div>
        </div>
      </header>

    <main>
      <section class="hero">
        <div>
          <h1>Things I like to hear.</h1>
        </div>
        <p class="count" id="song-count"></p>
      </section>

      <div id="song-grid" class="song-grid"></div>

      <div id="error" class="collection-state" hidden></div>
    </main>

    <footer class="footer">
      <span>Chen</span>
      <span id="year"></span>
    </footer>
  </div>

  <script src="/site-nav.js?v=5" defer></script>
  <script src="/collection-common.js?v=1" defer></script>
  <script src="/music/script.js?v=9" defer></script>
<script src="/back-to-top.js?v=1" defer></script>
</body>
</html>
