<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="/works/works-favicon.svg?v=1">
  <link rel="apple-touch-icon" href="/works/works-favicon.svg?v=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
  <!-- 主题固定为深色
       主题切换按钮已移除，所以这里不再读取 localStorage 或系统偏好 ——
       否则一个遗留的 "light" 偏好会让访客看到浅色，而他已经无法切回。
       保留写入是为了别的脚本/以后恢复按钮时仍有一致的键名。 -->
  <script>
    (() => {
      document.documentElement.dataset.theme = "dark";
      try { localStorage.setItem("pref-theme", "dark"); } catch (e) { /* 隐私模式忽略 */ }
    })();
  </script>

  <!-- 站点部署在 origin 根（0-1byte.github.io），因此统一使用根绝对路径。
       若将来改为子目录部署，需同步调整这些引用与 baseURL。 -->
  <link rel="preload" href="/works/works.json?v=3" as="fetch" type="application/json" crossorigin="anonymous">
  <link rel="stylesheet" href="/theme.css?v=1">
  <link rel="stylesheet" href="/site-nav.css?v=5">
  <link rel="stylesheet" href="/collection-states.css?v=2">
  <link rel="stylesheet" href="/back-to-top.css?v=1">
  <link rel="stylesheet" href="/works/style.css?v=3">
  <title>Works — Chen</title>
</head>
<body>
  <div class="page">
    <header class="header">
        <div class="logo">
          <a href="/" accesskey="h" title="Chen (Alt + H)">Chen</a>
        </div>
      <div class="header-nav">
        <div class="site-nav" data-site-nav></div>
        </div>
      </header>

    <main>
      <section class="hero">
        <h1>Things I made.</h1>
        <p class="hero-sub">产品、工具与一些没忍住动手的小实验。</p>
        <p class="hero-meta"><span id="works-count"></span><span id="works-range"></span></p>
      </section>

      <div class="toolbar" id="toolbar" hidden>
        <div class="filters" id="filters" role="group" aria-label="按类型筛选"></div>
        <label class="search">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" aria-hidden="true">
            <circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/>
          </svg>
          <input id="search" type="search" placeholder="搜索作品、技术栈…" autocomplete="off" aria-label="搜索作品">
        </label>
      </div>

      <div id="works-grid" class="works-grid"></div>

      <div id="empty" class="empty" hidden>
        这里还没有作品。编辑 <code>/works/works.json</code> 开始记录。
      </div>
      <p id="no-match" class="empty" hidden>没有匹配的作品，换个关键词或筛选试试。</p>
      <div id="error" class="collection-state" hidden></div>
    </main>

    <footer class="footer">
      <span>Chen</span>
      <span id="year"></span>
    </footer>
  </div>

  <div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" aria-hidden="true">
    <button class="drawer-close" id="drawer-close" type="button" aria-label="关闭详情">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" aria-hidden="true">
        <line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/>
      </svg>
    </button>
    <div class="drawer-body" id="drawer-body"></div>
  </aside>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="/site-nav.js?v=5" defer></script>
  <script src="/collection-common.js?v=1" defer></script>
  <script src="/works/script.js?v=3" defer></script>
<script src="/back-to-top.js?v=1" defer></script>
</body>
</html>
