<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="/works/works-favicon.svg?v=1">
  <link rel="apple-touch-icon" href="/works/works-favicon.svg?v=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
  <script>
    (() => {
      const saved = localStorage.getItem("pref-theme") || localStorage.getItem("music-theme");
      if (saved && !localStorage.getItem("pref-theme")) localStorage.setItem("pref-theme", saved);
      const dark = saved === "dark" || (!saved && window.matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.dataset.theme = dark ? "dark" : "light";
    })();
  </script>
  <!-- 站点部署在 origin 根（0-1byte.github.io），因此统一使用根绝对路径。
       若将来改为子目录部署，需同步调整这些引用与 baseURL。 -->
  <link rel="preload" href="/works/works.json?v=2" as="fetch" type="application/json" crossorigin="anonymous">
  <link rel="stylesheet" href="/collection-states.css?v=1">
  <link rel="stylesheet" href="/back-to-top.css?v=1">
  <link rel="stylesheet" href="/works/style.css?v=2">
  <title>Works — Chen</title>
</head>
<body>
  <div class="page">
    <header class="header">
      <nav class="site-nav" aria-label="Site navigation">
        <a href="/">Chen</a><a href="/music/">Music</a><a href="/book/">Book</a><a href="/works/">Works</a><a href="/docu/">Docu</a><a href="/film/">Film</a><a href="/tv/">TV</a>
      </nav>
      <button id="theme-toggle" class="theme-toggle" accesskey="t" type="button"
              aria-label="切换主题" title="切换主题">
        <svg class="moon" xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
        <svg class="sun" xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
      </button>
    </header>

    <main>
      <section class="hero">
        <h1>Things I made.</h1>
        <p class="hero-sub">产品、工具与一些没忍住动手的小实验。</p>
        <p class="hero-meta"><span id="works-count"></span><span id="works-range"></span></p>
      </section>

      <div class="toolbar" id="toolbar" hidden>
        <div class="filters" id="filters" role="group" aria-label="按类型筛选"></div>
        <label class="search">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" aria-hidden="true">
            <circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/>
          </svg>
          <input id="search" type="search" placeholder="搜索作品、技术栈…" autocomplete="off" aria-label="搜索作品">
        </label>
      </div>

      <div id="works-grid" class="works-grid"></div>

      <div id="empty" class="empty" hidden>
        这里还没有作品。编辑 <code>/works/works.json</code> 开始记录。
      </div>
      <p id="no-match" class="empty" hidden>没有匹配的作品，换个关键词或筛选试试。</p>
      <div id="error" class="collection-state" hidden></div>
    </main>

    <footer class="footer">
      <span>Chen</span>
      <span id="year"></span>
    </footer>
  </div>

  <div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" aria-hidden="true">
    <button class="drawer-close" id="drawer-close" type="button" aria-label="关闭详情">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" aria-hidden="true">
        <line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/>
      </svg>
    </button>
    <div class="drawer-body" id="drawer-body"></div>
  </aside>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="/collection-common.js?v=1" defer></script>
  <script src="/works/script.js?v=2" defer></script>
<script src="/back-to-top.js?v=1" defer></script>
</body>
</html>
