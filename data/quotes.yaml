# 首屏句子库
#
# 首页每次刷新，从下面随机抽一句，一个字符一个字符打出来。
#
# 格式：
#   - text: 句子内容
#     source: 出处        # 可省略，省略时不显示出处
#
# 注意：
#   · 句子里有冒号时整行加引号：- text: "他说：慢一点。"
#   · 建议每句不超过 60 个字（打字速度约每秒 19 个字符，60 字约 3 秒打完）
#   · 全部注释掉时首页会显示兜底文案，不会变成空白
#
# 下面两句原本是 content/_index.md 里 focus 的两行，内容没有改动。

- text: building small things,
- text: thinking about large things.

# ---------------------------------------------------------------------------
# 以下是给你加句子用的空位 —— 取消注释并填内容即可。
#
# 之后接微信读书划线时，工具会按同一格式追加到这个文件末尾，
# 详细的对接约定见 static/quotes/README.md
